<!DOCTYPE html>
<html lang="en" data-surface="overlay">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline'">
<title>Song Queue Overlay</title>
<script src="/shared/i18n.js"></script>
<script src="/shared/i18n-viewer.js"></script>
<link rel="stylesheet" href="/shared/themes.css">
<script src="/shared/theme.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    background: transparent !important;
    background-color: transparent !important;
    /* Render at 2x and let OBS/Streamlabs downscale the Browser Source by
       50% -- supersampling makes text and edges noticeably sharper. */
    zoom: 2;
  }

  /* Colours and fonts: shared/themes.css (🎨 Look & overlays → overlay theme, or ?theme= in the URL) */
  :root[data-surface="overlay"] {   /* outranks the theme's own --bg-panel (themes.css) */
    --panel-bg-alpha: 0.92;
    --text-brightness: 1;
    --ts: 1;   /* the song lists' text size (🎨 Look & overlays → Song list text) */
    --bg-panel: rgba(var(--panel-rgb), var(--panel-bg-alpha));
    --bg-card: rgba(var(--card-rgb), 0.95);
    --list-height: 240px;
  }

  html, body {
    width: 480px;
    background: transparent !important;
    background-color: transparent !important;
    font-family: var(--font-body);
    color: var(--text);
    overflow: hidden;
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    position: relative;
    backdrop-filter: blur(8px);
    filter: brightness(var(--text-brightness));
    display: flex;
    flex-direction: column;
  }
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 10px; height: 10px;
  }
  .panel::before { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .panel::after  { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

  /* ── Header ── */
  .header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-shrink: 0;
  }
  .header-title {
    font-family: var(--font-display);
    font-size: 10px; font-weight: 500; letter-spacing: 3px;
    color: var(--accent-dim); text-transform: uppercase; flex: 1;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); animation: blink 2s ease-in-out infinite;
  }
  .status-dot.disconnected { background: var(--danger); animation: none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 3px; letter-spacing: 1px;
    background: rgba(var(--tint-accent-rgb), 0.4); border: 1px solid rgba(var(--accent-deep-rgb), 0.4); color: var(--accent);
  }

  /* ── Now Playing ── One height whether a song plays or not, with or without an artist, in any
     font: the panel never changes size, so the Browser Source size in the docs is exact. */
  .now-playing {
    height: 123px; overflow: hidden;
    background: transparent;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .np-label     { font-size: 8px; line-height: 12px; letter-spacing: 3px; color: var(--accent-dim); margin-bottom: 4px; }
  .np-title     {
    font-family: var(--font-display); font-size: 32px; font-weight: 500; color: var(--text-strong);
    height: 40px; line-height: 40px; white-space: nowrap; overflow: hidden;
  }
  .np-title-inner {
    display: inline-block;
    white-space: nowrap;
  }
  .np-artist    { font-size: 15px; height: 20px; line-height: 20px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-requester { font-size: 13px; height: 18px; line-height: 18px; color: var(--info); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-empty     { font-size: 12px; color: var(--text-muted); line-height: 44px; }
  @keyframes scroll-title {
    0%      { transform: translateX(0); }
    20%     { transform: translateX(0); }
    78%     { transform: translateX(var(--scroll-dist, 0)); }
    99.9%   { transform: translateX(var(--scroll-dist, 0)); }
    100%    { transform: translateX(0); }
  }
  .np-title-inner.scrolling { animation: scroll-title var(--scroll-duration, 6s) ease-in-out infinite; }

  /* ── Section dividers ── */
  .section-header {
    font-size: 8px; letter-spacing: 3px; margin-bottom: 6px; flex-shrink: 0;
  }
  .section-header.purple { color: var(--text-muted); }  .section-header.green  { color: rgba(var(--good-deep-rgb), 0.7); margin-top: 10px; }

  /* ── Auto-scrolling ticker lists ── */
  .scroll-list {
    height: var(--list-height);
    overflow: hidden;
    position: relative;
  }

  /* Fade out top edge so items glide out smoothly */
  .scroll-list::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 24px;
    z-index: 1;
    pointer-events: none;
  }
  .scroll-list.queue-scroll::before  { background: linear-gradient(to bottom, rgba(var(--panel-rgb), var(--panel-bg-alpha)), transparent); }
  .scroll-list.played-scroll::before { background: linear-gradient(to bottom, rgba(var(--panel-rgb), var(--panel-bg-alpha)), transparent); }

  .scroll-inner {
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: absolute;
    width: 100%;
  }

  /* ── Divider line ── */
  .divider-line {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(var(--accent-deep-rgb), 0.3), transparent);
    margin: 10px 0;
    flex-shrink: 0;
  }

  /* ── List items ── */
  .queue-item, .played-item {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 8px; border-radius: 3px;
    animation: slide-in 0.3s ease; flex-shrink: 0;
  }
  .queue-item  { background: transparent; border: 1px solid rgba(var(--line-accent-rgb), 0.3); }
  .played-item { background: transparent; border: 1px solid rgba(var(--line-good-rgb), 0.3); }
  @keyframes slide-in { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }

  .q-num   { font-size: calc(13px * var(--ts)); color: var(--accent-dim); min-width: 22px; }
  .q-title { font-size: calc(21px * var(--ts)); color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-artist{ font-size: calc(15px * var(--ts)); color: var(--text-dim); }
  .q-req   { font-size: calc(13px * var(--ts)); color: var(--info); white-space: nowrap; }

  .p-num   { font-size: calc(13px * var(--ts)); color: rgba(var(--good-rgb), 0.6); min-width: 22px; }
  .p-title { font-size: calc(21px * var(--ts)); color: var(--played-text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-artist{ font-size: calc(15px * var(--ts)); color: var(--played-dim); }
  .p-req   { font-size: calc(13px * var(--ts)); color: rgba(var(--info-rgb), 0.6); white-space: nowrap; }

  .played-badge {
    font-size: 12px; padding: 2px 8px; border-radius: 3px; letter-spacing: 1px;
    background: rgba(var(--tint-good-rgb), 0.4); border: 1px solid rgba(var(--good-deep-rgb), 0.4); color: var(--good);
  }

  .list-empty { font-size: calc(10px * var(--ts)); color: var(--text-muted); text-align: center; padding: 8px 0; }

  /* ── Song notes (chat named a song: "title - 99 days ago" since it was last sung): floating
        at the bottom of the overlay, over the Played list. A new one comes up from the bottom and
        pushes the others up. Amber = sung within the cooldown, green = can be requested ── */
  .played-section { position: relative; flex-shrink: 0; }
  .notes-over {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; pointer-events: none;
  }
  .note-item {
    display: flex; align-items: baseline; gap: 8px; padding: 5px 10px; border-radius: 4px;
    background: var(--note-good-bg); border: 1px solid rgba(var(--good-rgb), 0.5); border-left: 3px solid var(--good);
    box-shadow: 0 4px 14px rgba(var(--shadow-rgb), calc(0.5 * var(--shadow-k))); animation: note-up 0.35s ease;
  }
  @keyframes note-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .note-item.recent { background: var(--note-warn-bg); border-color: rgba(var(--warn-rgb), 0.6); border-left-color: var(--warn); }
  .n-title { font-size: calc(21px * var(--ts)); color: var(--note-good-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .n-days  { font-size: calc(19px * var(--ts)); color: var(--good); white-space: nowrap; }
  .note-item.recent .n-title { color: var(--note-warn-text); }
  .note-item.recent .n-days { color: var(--warn); }
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <span class="status-dot disconnected" id="dot"></span>
    <span class="header-title" data-i18n="overlay.title">Song Queue</span>
    <span class="badge" id="queue-badge">0 waiting</span>
  </div>

  <!-- Now Playing -->
  <div class="now-playing">
    <p class="np-label" data-i18n="overlay.nowPlaying">NOW PLAYING</p>
    <p class="np-empty"    id="np-empty"      data-i18n="overlay.noSong">no song loaded</p>
    <p class="np-title"    id="np-title"      style="display:none"><span class="np-title-inner" id="np-title-inner"></span></p>
    <p class="np-artist"   id="np-artist"     style="display:none"></p>
    <p class="np-requester"id="np-requester"  style="display:none"></p>
  </div>

  <!-- Up Next -->
  <p class="section-header purple" data-i18n="overlay.upNext">// UP NEXT</p>
  <div class="scroll-list queue-scroll" id="queue-list">
    <div class="scroll-inner" id="queue-inner">
      <p class="list-empty" data-i18n="overlay.noRequests">no requests yet…</p>
    </div>
  </div>

  <div class="divider-line"></div>

  <!-- Played; song notes float over it while chat names songs (paintNotes) -->
  <div class="played-section">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-shrink:0;">
      <p class="section-header green" style="margin:0;flex:1;" data-i18n="overlay.played">// PLAYED</p>
      <span class="played-badge" id="played-badge">0 songs</span>
    </div>
    <div class="scroll-list played-scroll" id="played-list">
      <div class="scroll-inner" id="played-inner">
        <p class="list-empty" data-i18n="overlay.nothingPlayed">nothing played yet…</p>
      </div>
    </div>
    <div class="notes-over" id="notes-list" aria-live="polite"></div>
  </div>
</div>


<script>
const t = I18N.t;
let lastState = null;   // redrawn when the overlay language changes
const WS_URL = `ws://${location.host}`;
let ws, reconnectTimer;

const tickers = {
  queue:  { el: null, inner: null, offset: 0, loopAt: 0, raf: null, lastTime: null },
  played: { el: null, inner: null, offset: 0, loopAt: 0, raf: null, lastTime: null },
};
const SCROLL_PX_PER_SEC = 16;

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen  = () => { document.getElementById('dot').classList.remove('disconnected'); clearTimeout(reconnectTimer); };
  ws.onclose = () => { document.getElementById('dot').classList.add('disconnected'); reconnectTimer = setTimeout(connect, 3000); };
  ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === 'state') renderState(m);
      if (m.type === 'settings') applySettings(m);
      if (m.type === 'song-note') showSongNote(m);
    } catch(_) {}
  };
}

function applySettings({ panelBgAlpha, textBrightness, overlayLanguage, overlayTheme, songTextScale }) {
  if (overlayLanguage) I18N.setLang(overlayLanguage, { save: false, tagPage: false });
  if (overlayTheme) Theme.apply(overlayTheme);
  if (songTextScale) { Theme.scale(songTextScale); if (lastState) renderState(lastState); }   // the tickers measure again
  if (panelBgAlpha != null) {
    document.documentElement.style.setProperty('--panel-bg-alpha', panelBgAlpha);
  }
  if (textBrightness != null) {
    document.documentElement.style.setProperty('--text-brightness', textBrightness);
  }
}

async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    applySettings(await res.json());
  } catch(_) {}
}

function renderState(stateMsg) {
  lastState = stateMsg;
  const { nowPlaying, queue, playedSongs } = stateMsg;
  // ── Now Playing ──
  const empty = document.getElementById('np-empty');
  const title = document.getElementById('np-title');
  const artist = document.getElementById('np-artist');
  const req = document.getElementById('np-requester');
  if (nowPlaying) {
    empty.style.display = 'none';
    const inner = document.getElementById('np-title-inner');
    title.style.display = 'block';
    inner.textContent = nowPlaying.title;
    inner.classList.remove('scrolling');
    inner.style.removeProperty('--scroll-dist');
    inner.style.removeProperty('--scroll-duration');
    artist.style.display = nowPlaying.artist ? 'block' : 'none'; artist.textContent = nowPlaying.artist;
    req.style.display = 'block'; req.textContent = t('overlay.requestedBy', { name: nowPlaying.requester });
    requestAnimationFrame(() => {
      const overflow = inner.scrollWidth - title.clientWidth;
      if (overflow > 10) {
        inner.style.setProperty('--scroll-dist', `-${overflow + 20}px`);
        // Speed: ~80px/sec, min 4s, max 20s, plus pauses
        const duration = Math.min(40, Math.max(8, (overflow / 20) + 5));
        inner.style.setProperty('--scroll-duration', `${duration.toFixed(1)}s`);
        inner.classList.add('scrolling');
      }
    });
  } else {
    empty.style.display = 'block';
    [title, artist, req].forEach(el => el.style.display = 'none');
  }

  // ── Queue list ──
  document.getElementById('queue-badge').textContent = t('overlay.waiting', { n: queue.length });
  const qInner = document.getElementById('queue-inner');
  qInner.innerHTML = queue.length === 0
    ? `<p class="list-empty">${esc(t('overlay.noRequests'))}</p>`
    : queue.map((item, i) => `
        <div class="queue-item">
          <span class="q-num">${String(i+1).padStart(2,'0')}</span>
          <span class="q-title">${esc(item.title)}${item.artist ? ` <span class="q-artist">${esc(item.artist)}</span>` : ''}</span>
          <span class="q-req">@${esc(item.requester)}</span>
        </div>`).join('');
  resetTicker('queue', document.getElementById('queue-list'), qInner);

  // ── Played list ──
  const played = playedSongs || [];
  document.getElementById('played-badge').textContent = t('overlay.playedCount', { n: played.length });
  const pInner = document.getElementById('played-inner');
  pInner.innerHTML = played.length === 0
    ? `<p class="list-empty">${esc(t('overlay.nothingPlayed'))}</p>`
    : played.map((item, i) => `
        <div class="played-item">
          <span class="p-num">${String(i+1).padStart(2,'0')}</span>
          <span class="p-title">${esc(item.title)}${item.artist ? ` <span class="p-artist">${esc(item.artist)}</span>` : ''}</span>
          <span class="p-req">@${esc(item.requester)}</span>
        </div>`).join('');
  resetTicker('played', document.getElementById('played-list'), pInner);
}

function resetTicker(key, container, inner) {
  const t = tickers[key];
  if (t.raf) { cancelAnimationFrame(t.raf); t.raf = null; }

  // Remove clones from any previous run
  inner.querySelectorAll('[data-clone]').forEach(el => el.remove());

  t.el = container;
  t.inner = inner;
  t.offset = 0;
  t.loopAt = 0;
  t.lastTime = null;
  inner.style.transform = 'translateY(0)';

  requestAnimationFrame(() => {
    if (inner.scrollHeight <= container.clientHeight) return;

    // Duplicate all items — seamless loop: when we've scrolled one copy,
    // wrap offset back to 0; the clone looks identical so there's no jump.
    Array.from(inner.children).forEach(child => {
      const clone = child.cloneNode(true);
      clone.setAttribute('data-clone', '1');
      inner.appendChild(clone);
    });

    requestAnimationFrame(() => {
      const firstClone = inner.querySelector('[data-clone]');
      t.loopAt = firstClone ? firstClone.offsetTop : 0;
      setTimeout(() => startTicker(key), 2000);
    });
  });
}

function startTicker(key) {
  const t = tickers[key];
  if (!t.el || !t.inner || !t.loopAt) return;
  function step(timestamp) {
    if (!t.lastTime) t.lastTime = timestamp;
    const delta = (timestamp - t.lastTime) / 1000;
    t.lastTime = timestamp;
    t.offset += SCROLL_PX_PER_SEC * delta;
    if (t.offset >= t.loopAt) t.offset -= t.loopAt;
    t.inner.style.transform = `translateY(-${t.offset}px)`;
    t.raf = requestAnimationFrame(step);
  }
  t.raf = requestAnimationFrame(step);
}

// Song notes: chat named a song; "title - 99 days" since it was last sung (server/song-notes.js).
// days null = never sung; recent = within the cooldown. They float at the bottom of the overlay:
// a new one comes up from the bottom, pushing the others up. At most NOTES_MAX show; when full,
// the oldest (top) one makes room. Each shows for NOTE_MS.
const NOTE_MS = 15000;
const NOTES_MAX = 4;
let songNotes = [];

function showSongNote({ title, days, recent }) {
  if (songNotes.some(n => n.title === title)) return;
  const box = document.getElementById('notes-list');
  while (songNotes.length >= NOTES_MAX) {
    songNotes.shift();
    box.firstElementChild?.remove();
  }
  const note = { title, days, recent, until: Date.now() + NOTE_MS };
  songNotes.push(note);
  box.insertAdjacentHTML('beforeend', noteHtml(note));
}

function noteHtml(n) {
  return `<div class="note-item${n.recent ? ' recent' : ''}">
      <span class="n-title">${esc(n.title)}</span>
      <span class="n-days">- ${esc(n.days == null ? t('overlay.never') : t('overlay.days', { n: n.days }))}</span>
    </div>`;
}

// Redraws all (language change, expiry) without the come-up animation
function paintNotes() {
  const box = document.getElementById('notes-list');
  box.innerHTML = songNotes.map(noteHtml).join('');
  for (const el of box.children) el.style.animation = 'none';
}

setInterval(() => {
  const left = songNotes.filter(n => n.until > Date.now());
  if (left.length !== songNotes.length) { songNotes = left; paintNotes(); }
}, 1000);

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// The language is the server's overlay setting; English until it arrives
I18N.setLang('en', { save: false, tagPage: false });
I18N.onChange(() => { if (lastState) renderState(lastState); paintNotes(); });

connect();
loadSettings();
</script>
</body>
</html>
